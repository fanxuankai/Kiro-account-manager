# 打包 Windows(NSIS) + macOS(dmg/zip 双架构),产物统一由 release job 汇总建草稿
# 触发:Actions → Build App → Run workflow,或 gh workflow run build-app.yml
# 草稿标签取 package.json 版本(v{version});确认后手动 Publish,在线更新依赖正式 Release
name: Build & Release

on:
  workflow_dispatch:

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (NSIS x64)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # 帮 node-gyp 定位 runner 上的 VS2022 C++ 工具链(如需源码重编译)
      GYP_MSVS_VERSION: "2022"
    defaults:
      run:
        working-directory: Kiro-account-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Kiro-account-manager/package-lock.json

      - name: Install dependencies
        run: npm ci

      # hy2(Hysteria2)代理桥内核:按平台下载进 extraResources 一起打包
      - name: Fetch sing-box kernel
        run: node scripts/fetch-singbox.mjs

      # 只打包不发布:发布统一由 release job 做,避免多 job 各建 Release 互相分裂
      - name: Build (Windows)
        run: npm run build:win -- --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            Kiro-account-manager/dist/*-setup.exe
            Kiro-account-manager/dist/*-setup.exe.blockmap
            Kiro-account-manager/dist/latest.yml
          if-no-files-found: error

  build-macos:
    name: macOS (dmg/zip x64+arm64)
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Kiro-account-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Kiro-account-manager/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch sing-box kernel
        run: node scripts/fetch-singbox.mjs

      - name: Build (macOS)
        run: npm run build:mac -- --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            Kiro-account-manager/dist/*.dmg
            Kiro-account-manager/dist/*.dmg.blockmap
            Kiro-account-manager/dist/*-mac.zip
            Kiro-account-manager/dist/*-mac.zip.blockmap
            Kiro-account-manager/dist/latest-mac.yml
          if-no-files-found: error

  # 唯一的发布入口:汇总两个平台的产物,一次性建草稿 Release(无并发分裂)
  release:
    name: Draft Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve version
        id: ver
        run: echo "version=$(jq -r .version Kiro-account-manager/package.json)" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" artifacts/* \
            --draft --generate-notes \
            --title "v${{ steps.ver.outputs.version }}"
